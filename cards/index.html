<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scan a card – Kishan &amp; Sheena</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }   /* transparent so the live camera feed behind the 3D scene shows through */
  #loading, #hint {
    position: fixed; left: 0; right: 0; text-align: center; color: #3b2a22; z-index: 10; pointer-events: none;
  }
  #loading { top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fdf3d9; font-size: 18px; gap: 8px; transition: opacity .4s; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
  #hint { bottom: 24px; font-size: 15px; opacity: 0; transition: opacity .4s; }
  #hint span { background: #fffd; padding: 8px 14px; border-radius: 999px; }
  #hint.show { opacity: 1; }
</style>
</head>
<body>
<a href="../" style="position:fixed;top:12px;left:12px;z-index:20;font:12px system-ui,sans-serif;letter-spacing:.12em;color:#3b2a22;text-decoration:none;background:#fffd;border-radius:999px;padding:6px 12px">&#8592; HOME</a>
<a href="gallery/" style="position:fixed;top:12px;right:12px;z-index:20;font:12px system-ui,sans-serif;letter-spacing:.12em;color:#3b2a22;text-decoration:none;background:#fffd;border-radius:999px;padding:6px 12px">BROWSE MODELS</a>
<div id="loading">
  <div style="font-size:46px">📸</div>
  <div style="font-family:Georgia,serif;font-style:italic;font-weight:600;font-size:26px">Scan a card</div>
  <div style="max-width:300px;line-height:1.4;font-size:15px;opacity:.8">Allow the camera, then point it at one of the printed cards. Its little world pops up right on top of it.</div>
  <button id="start" style="pointer-events:auto;margin-top:8px;font:inherit;font-size:17px;font-weight:600;color:#3b2a22;background:#f2c6d0;border:0;border-radius:999px;padding:12px 26px;cursor:pointer">Start camera</button>
  <small id="note" style="opacity:.7;max-width:300px">If nothing happens, open this link in Safari or Chrome, not inside another app.</small>
</div>
<button id="mode" style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:20;font:12px system-ui,sans-serif;letter-spacing:.06em;color:#3b2a22;background:#fffd;border:0;border-radius:999px;padding:7px 14px;display:none">Holding the card up</button>
<div id="hint"><span>Point the camera at the card</span></div>

<!--
  Each card i is target index i in targets.mind (same order the images were compiled in).
  The card lies flat on the XY plane with +Z toward the viewer, so models are rotated 90° on X to stand upright.
  Card 0 model: diorama base ~4 units wide, scaled to ~0.9 of the card width.
-->
<a-scene mindar-image="imageTargetSrc: ./models/targets.mind; maxTrack: 2; filterMinCF: 0.0005; filterBeta: 0.003; uiLoading: no; uiScanning: no; uiError: yes; autoStart: false"
         color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity light="type: ambient; color: #fff; intensity: 1.4"></a-entity>
  <a-entity light="type: directional; color: #fff4dd; intensity: 1.6" position="0.5 -1 1.5"></a-entity>

  <!-- Card 0: "Back in the day" -->
  <a-entity id="t0" mindar-image-target="targetIndex: 0">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.22 0.22 0.22">
      <a-gltf-model data-src="./models/card0.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.35; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 1: "Aloo Tikki Day" -->
  <a-entity id="t1" mindar-image-target="targetIndex: 1">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.17 0.17 0.17">
      <a-gltf-model data-src="./models/card1.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.35; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 2: "It Takes Two" (no bobbing: petals and hearts animate inside the model) -->
  <a-entity id="t2" mindar-image-target="targetIndex: 2">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.16 0.16 0.16">
      <a-gltf-model data-src="./models/card2.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 3: "Mother-Daughter Bond" -->
  <a-entity id="t3" mindar-image-target="targetIndex: 3">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.14 0.14 0.14">
      <a-gltf-model data-src="./models/card3.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 4: "Pani Puri Time" -->
  <a-entity id="t4" mindar-image-target="targetIndex: 4">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.14 0.14 0.14">
      <a-gltf-model data-src="./models/card4.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 5: "Past Midnight" -->
  <a-entity id="t5" mindar-image-target="targetIndex: 5">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.1 0.1 0.1">
      <a-gltf-model data-src="./models/card5.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 6: "Couch Crew" -->
  <a-entity id="t6" mindar-image-target="targetIndex: 6">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.16 0.16 0.16">
      <a-gltf-model data-src="./models/card6.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 7: "Generational Selfie" -->
  <a-entity id="t7" mindar-image-target="targetIndex: 7">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.16 0.16 0.16">
      <a-gltf-model data-src="./models/card7.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 8: "Selfie Squad" -->
  <a-entity id="t8" mindar-image-target="targetIndex: 8">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.16 0.16 0.16">
      <a-gltf-model data-src="./models/card8.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 9: "Birthday Special" -->
  <a-entity id="t9" mindar-image-target="targetIndex: 9">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.15 0.15 0.15">
      <a-gltf-model data-src="./models/card9.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 10: "Wig Day" -->
  <a-entity id="t10" mindar-image-target="targetIndex: 10">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.16 0.16 0.16">
      <a-gltf-model data-src="./models/card10.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <!-- Card 11: "Family Trip" -->
  <a-entity id="t11" mindar-image-target="targetIndex: 11">
    <a-entity class="wrap" position="0 0 0.04" rotation="20 0 0" scale="0.14 0.14 0.14">
      <a-gltf-model data-src="./models/card11.opt.glb" animation-mixer="clip: Idle; loop: repeat"
        animation="property: object3D.position.y; from: 0; to: 0.3; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine">
      </a-gltf-model>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const scene = document.querySelector('a-scene');
  const loading = document.getElementById('loading');
  const hint = document.getElementById('hint');
  const startBtn = document.getElementById('start'), note = document.getElementById('note');
  const showError = (msg) => { loading.style.opacity = 1; loading.style.pointerEvents = 'auto'; loading.innerHTML = '<div style="font-size:42px">😢</div><div>' + msg + '</div><small>Use https, allow the camera, and open the link in Safari or Chrome.</small><a href="gallery/" style="pointer-events:auto;color:#3b2a22;margin-top:8px">Browse the models instead</a>'; };
  startBtn.addEventListener('click', () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return showError('This browser cannot open the camera');
    startBtn.disabled = true; startBtn.textContent = 'Getting the cards ready…'; note.textContent = 'Allow camera access when asked.';
    const go = () => { try { Promise.resolve(scene.systems['mindar-image-system'].start()).catch(() => showError('Camera unavailable')); } catch (e) { showError('Camera unavailable'); } };
    if (scene.hasLoaded) go(); else scene.addEventListener('loaded', go, { once: true });
  });
  const modeBtn = document.getElementById('mode');
  let flat = false; try { flat = localStorage.getItem('cardsMode') === 'flat'; } catch (e) {}
  const applyMode = () => {            // hand: the diorama leans toward you; flat: it stands up off a card lying on a table
    document.querySelectorAll('.wrap').forEach((w) => w.setAttribute('rotation', (flat ? 90 : 20) + ' 0 0'));
    modeBtn.textContent = flat ? 'Card lying on a table' : 'Holding the card up';
  };
  modeBtn.addEventListener('click', () => { flat = !flat; try { localStorage.setItem('cardsMode', flat ? 'flat' : 'hand'); } catch (e) {} applyMode(); });
  applyMode();
  scene.addEventListener('arReady', () => { loading.style.opacity = 0; setTimeout(() => loading.remove(), 500); hint.classList.add('show'); modeBtn.style.display = 'block'; });
  scene.addEventListener('arError', () => showError('Camera unavailable'));
  document.querySelectorAll('[mindar-image-target]').forEach((t) => {
    t.addEventListener('targetFound', () => {
      hint.classList.remove('show');
      const m = t.querySelector('a-gltf-model');
      if (m && !m.getAttribute('gltf-model')) m.setAttribute('gltf-model', m.dataset.src);      // download this card's model the first time it is seen
    });
    t.addEventListener('targetLost', () => hint.classList.add('show'));
  });
</script>
</body>
</html>
